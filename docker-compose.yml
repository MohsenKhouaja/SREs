name: ${COMPOSE_PROJECT_NAME:-sres}

services:
  backend:
    build: ./backend
    # The backend needs direct host networking so Groq remains reachable on
    # IPv6-only host connections. The observability services stay isolated on
    # the project bridge and are reached through their published host ports.
    network_mode: host
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_MAX_TOKENS: ${GROQ_MAX_TOKENS:-1024}
      GROQ_SERVICE_TIER: ${GROQ_SERVICE_TIER:-on_demand}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-sres-incident-response}
      MONGODB_URL: mongodb://127.0.0.1:${MONGODB_HOST_PORT:-27017}
      MONGODB_DATABASE: incident_response
      PROMETHEUS_URL: http://127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}
      LOKI_URL: http://127.0.0.1:${LOKI_HOST_PORT:-3100}
      SAMPLE_API_URL: http://127.0.0.1:${SAMPLE_API_HOST_PORT:-8001}
      SAMPLE_PAYMENT_URL: http://127.0.0.1:${SAMPLE_PAYMENT_HOST_PORT:-8002}
      LAB_CONTROLLER_URL: http://127.0.0.1:8010
      LAB_MONITOR_TOKEN: ${LAB_MONITOR_TOKEN:?set LAB_MONITOR_TOKEN in .env}
      LAB_OPERATOR_TOKEN: ${LAB_OPERATOR_TOKEN:?set LAB_OPERATOR_TOKEN in .env}
      INVESTIGATION_WARMUP_SECONDS: ${INVESTIGATION_WARMUP_SECONDS:-10}
      VERIFICATION_ROUNDS: ${VERIFICATION_ROUNDS:-3}
      VERIFICATION_INTERVAL_SECONDS: ${VERIFICATION_INTERVAL_SECONDS:-5}
      VERIFICATION_TIMEOUT_SECONDS: ${VERIFICATION_TIMEOUT_SECONDS:-60}
    depends_on:
      mongodb: {condition: service_healthy}
      prometheus: {condition: service_healthy}
      loki: {condition: service_healthy}
      sample-api: {condition: service_healthy}
      sample-payment: {condition: service_healthy}
      lab-controller: {condition: service_healthy}
    healthcheck:
      # Probe HTTP until readiness is proven once. Afterwards Docker verifies
      # that the Uvicorn process still exists without generating access logs.
      test: ["CMD-SHELL", "if [ -f /tmp/sres-backend-ready ]; then kill -0 1; else curl -f http://localhost:8000/health && touch /tmp/sres-backend-ready; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["${FRONTEND_HOST_PORT:-3001}:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [incident-response-net]

  lab-controller:
    build: ./lab-controller
    network_mode: host
    environment:
      MONGODB_URL: mongodb://127.0.0.1:${MONGODB_HOST_PORT:-27017}
      MONGODB_DATABASE: sres_lab_control
      MONITOR_TOKEN: ${LAB_MONITOR_TOKEN:?set LAB_MONITOR_TOKEN in .env}
      OPERATOR_TOKEN: ${LAB_OPERATOR_TOKEN:?set LAB_OPERATOR_TOKEN in .env}
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-sres}
      SAMPLE_API_PORT: ${SAMPLE_API_HOST_PORT:-8001}
      SAMPLE_API_NETWORK: ${COMPOSE_PROJECT_NAME:-sres}_incident-response-net
      POSTGRES_URL: postgresql://lab_controller:lab_controller@127.0.0.1:${POSTGRES_HOST_PORT:-5432}/incident_db
      SAMPLE_API_V1_IMAGE: sres-sample-api:v1
      SAMPLE_API_V2_IMAGE: sres-sample-api:v2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongodb: {condition: service_healthy}
      postgres-bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["${PROMETHEUS_HOST_PORT:-9090}:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [incident-response-net]

  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["${LOKI_HOST_PORT:-3100}:3100"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      # The official Loki image is intentionally minimal and does not ship
      # curl/wget. A successful version probe plus Docker's running-state check
      # gives dependants a portable readiness gate without a custom image.
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks: [incident-response-net]

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [incident-response-net]

  postgres:
    image: postgres:16-alpine
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incident_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incident_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [incident-response-net]

  postgres-bootstrap:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./postgres/bootstrap.sql:/bootstrap.sql:ro
    command: ["psql", "-h", "postgres", "-U", "postgres", "-d", "incident_db", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap.sql"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    networks: [incident-response-net]

  mongodb:
    image: mongo:7
    ports: ["${MONGODB_HOST_PORT:-27017}:27017"]
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [incident-response-net]

  sample-api:
    image: sres-sample-api:v1
    build:
      context: ./sample-apps
      args: {RELEASE: v1}
    ports: ["${SAMPLE_API_HOST_PORT:-8001}:8001"]
    environment:
      SERVICE_KIND: api
      PORT: 8001
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://app_user:app_user@postgres:5432/incident_db
      LOKI_URL: http://loki:3100
    depends_on:
      redis: {condition: service_healthy}
      postgres-bootstrap: {condition: service_completed_successfully}
      loki: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [incident-response-net]

  sample-payment:
    image: sres-sample-payment:v1
    build:
      context: ./sample-apps
      args: {RELEASE: v1}
    ports: ["${SAMPLE_PAYMENT_HOST_PORT:-8002}:8002"]
    environment:
      SERVICE_KIND: payment
      PORT: 8002
      REDIS_URL: redis://redis:6379
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/incident_db
      LOKI_URL: http://loki:3100
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      loki: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [incident-response-net]

volumes:
  prometheus-data:
  loki-data:
  mongodb-data:
  postgres-data:

networks:
  incident-response-net:
